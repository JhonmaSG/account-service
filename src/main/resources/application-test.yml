spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  data:
    mongodb:
      uri: ${MONGO_URI_TEST}
      database: ${MONGO_DB_TEST}
      auto-index-creation: false

  jpa:
    hibernate:
      ddl-auto: create-drop

jwt:
  secret: ${JWT_SECRET}
