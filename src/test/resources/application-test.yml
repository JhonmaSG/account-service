spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  data:
    mongodb:
      uri: mongodb://localhost:27017/finance_audit_test
      database: finance_audit_test
      auto-index-creation: false

  jpa:
    hibernate:
      ddl-auto: create-drop

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true

jwt:
  secret: ${JWT_SECRET:test-secret-key-for-jwt-token-minimum-32chars}
